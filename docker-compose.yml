services:
  # Database for both services
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track=all



  # Order Service
  order-service:
    build:
      context: .
      dockerfile: ./apps/order-service/Dockerfile
    container_name: order-service
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:password@postgres:5432/orders_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Invoice Service
  invoice-service:
    build:
      context: .
      dockerfile: ./apps/invoice-service/Dockerfile
    container_name: invoice-service
    environment:
      NODE_ENV: production
      PORT: 3002
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:password@postgres:5432/invoices_db
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      INVOICE_NUMBER_PREFIX: INV
      GENERATION_DELAY_MS: 5000
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3002/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Database Migrations Service
  migrations:
    image: postgres:15-alpine
    container_name: migrations
    environment:
      PGPASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/migrate-databases.sh:/migrate.sh:ro
      - ./apps/order-service/drizzle:/order-migrations:ro
      - ./apps/invoice-service/drizzle:/invoice-migrations:ro
    command: >
      sh -c "
        echo '⏳ Aguardando PostgreSQL estar pronto...' &&
        until pg_isready -h postgres -U postgres; do sleep 2; done &&
        echo '✅ PostgreSQL está pronto!' &&
        echo '🚀 Executando migrações...' &&
        sh /migrate.sh &&
        echo '✅ Migrações concluídas!'
      "
    restart: "no"

  # Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - '15672:15672'
      - '5672:5672'
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
